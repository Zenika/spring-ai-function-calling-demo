#spring.application.name=agentic-AI-demo
spring:
  application:
    name: agentic-AI-demo
  thymeleaf:
    check-template-location: true
  ai:
    ollama:
      chat:
        model: llama3.1:8b
#        model: llama3-groq-tool-use:8b
#        model: llama3.2:3b
#        model: hf.co/Salesforce/xLAM-1b-fc-r-gguf
#        model: hf.co/Salesforce/xLAM-1b-fc-r
        options:
          temperature: 0.1
      init:
        pull-model-strategy: when_missing
  datasource:
    url: jdbc:postgresql://localhost:5432/dossiers_remboursements
  docker:
    compose:
      file: src/main/docker/compose.yml

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.zenika.demo.ai.agentic.agenticaidemo: debug

dossier-remboursement:
  sql-system-prompt: classpath:prompts/dossier-remboursement-sql-query-system-prompt-en.md
  system-prompt: classpath:prompts/dossier-remboursement-system-prompt-en.md
